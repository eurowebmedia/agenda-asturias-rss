name: Actualizar agenda RSS

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python generar_rss.py
      - name: Guardar cambios
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add agenda-asturias.xml
          git diff --cached --quiet || git commit -m "Actualizar agenda"
          git push
